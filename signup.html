<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - DatesPDF</title>
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>
  <header class="navbar">
    <div class="navbar__container">
      <a href="index.html" class="navbar__logo">
        <span class="navbar__logo-icon"><i class="fas fa-file-pdf"></i></span>
        <span class="navbar__logo-text">Dates<span class="highlight">PDF</span></span>
      </a>
      <nav class="navbar__menu" id="navMenu">
        <ul class="navbar__links">
          <li><a href="index.html" class="navbar__link">All Tools</a></li>
          <li><a href="index.html#convert" class="navbar__link">Convert</a></li>
          <li><a href="index.html#organize" class="navbar__link">Organize</a></li>
          <li><a href="index.html#security" class="navbar__link">Security</a></li>
          <li><a href="contact.html" class="navbar__link">Contact</a></li>
        </ul>
      </nav>
      <div id="authNav"></div>
      <button class="navbar__toggle" id="navToggle" aria-label="Toggle navigation">
        <span class="navbar__toggle-bar"></span>
        <span class="navbar__toggle-bar"></span>
        <span class="navbar__toggle-bar"></span>
      </button>
    </div>
  </header>

  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-card__header">
        <div class="auth-card__icon auth-card__icon--green">
          <i class="fas fa-user-plus"></i>
        </div>
        <h1>Create Account</h1>
        <p>Sign up to get free access to all PDF tools</p>
      </div>

      <form class="auth-form" id="signupForm">
        <div class="auth-form__group">
          <label class="auth-form__label">Full Name</label>
          <div class="auth-form__input-wrap">
            <i class="fas fa-user"></i>
            <input type="text" id="signupName" placeholder="Enter your full name" required />
          </div>
        </div>

        <div class="auth-form__group">
          <label class="auth-form__label">Email</label>
          <div class="auth-form__input-wrap">
            <i class="fas fa-envelope"></i>
            <input type="email" id="signupEmail" placeholder="Enter your email" required />
          </div>
        </div>

        <div class="auth-form__group">
          <label class="auth-form__label">Password</label>
          <div class="auth-form__input-wrap">
            <i class="fas fa-lock"></i>
            <input type="password" id="signupPassword" placeholder="At least 6 characters" required minlength="6" />
          </div>
        </div>

        <div class="auth-form__group">
          <label class="auth-form__label">Confirm Password</label>
          <div class="auth-form__input-wrap">
            <i class="fas fa-lock"></i>
            <input type="password" id="signupConfirm" placeholder="Confirm your password" required />
          </div>
        </div>

        <div class="auth-form__error" id="signupError"></div>

        <button type="submit" class="auth-form__submit auth-form__submit--green">
          <i class="fas fa-user-plus"></i> Create Account
        </button>
      </form>

      <div class="auth-card__footer">
        <p>Already have an account? <a href="login.html">Log In</a></p>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (Auth.isLoggedIn()) {
        window.location.href = "index.html";
        return;
      }

      Auth.updateNavbar();

      document.getElementById("signupForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const name = document.getElementById("signupName").value;
        const email = document.getElementById("signupEmail").value;
        const password = document.getElementById("signupPassword").value;
        const confirm = document.getElementById("signupConfirm").value;
        const errorEl = document.getElementById("signupError");

        if (password !== confirm) {
          errorEl.textContent = "Passwords do not match.";
          errorEl.style.display = "block";
          return;
        }

        const result = Auth.signup(name, email, password);
        if (result.success) {
          window.location.href = Auth.getRedirectUrl();
        } else {
          errorEl.textContent = result.message;
          errorEl.style.display = "block";
        }
      });
    });
  </script>
</body>
</html>
