<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Split PDF - DatesPDF</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<body>
  <header class="navbar">
    <div class="navbar__container">
      <a href="../index.html" class="navbar__logo">
        <span class="navbar__logo-icon"><i class="fas fa-file-pdf"></i></span>
        <span class="navbar__logo-text">Dates<span class="highlight">PDF</span></span>
      </a>
      <nav class="navbar__menu" id="navMenu">
        <ul class="navbar__links">
          <li><a href="../index.html" class="navbar__link">All Tools</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <div class="tool-page">
    <div class="tool-header">
      <div class="tool-header__icon tool-card__icon--blue">
        <i class="fas fa-cut"></i>
      </div>
      <h1>Split PDF</h1>
      <p>Split a PDF file into individual pages</p>
    </div>

    <div class="tool-workspace">
      <div class="tool-workspace__container">
        <div class="drop-zone" id="dropZone">
          <div class="drop-zone__icon"><i class="fas fa-cloud-upload-alt"></i></div>
          <p class="drop-zone__text">Drop a PDF file here</p>
          <p class="drop-zone__hint">or click to browse</p>
          <button class="drop-zone__btn"><i class="fas fa-plus"></i> Choose File</button>
          <input type="file" id="fileInput" accept=".pdf" hidden />
        </div>

        <div id="fileList" class="file-list"></div>

        <div class="tool-options" id="splitOptions" style="display:none">
          <h3>Split Options</h3>
          <div class="tool-options__group">
            <label class="tool-options__label">Pages to extract (e.g., 1,3,5-8)</label>
            <input type="text" class="tool-options__input" id="pageRange" placeholder="Leave empty to split all pages" />
          </div>
        </div>

        <div class="tool-action">
          <button class="tool-action__btn" id="actionBtn" disabled>
            <i class="fas fa-cut"></i> Split PDF
          </button>
        </div>

        <div class="progress-bar" id="progressBar">
          <div class="progress-bar__track">
            <div class="progress-bar__fill" id="progressFill"></div>
          </div>
          <p class="progress-bar__text" id="progressText">Processing...</p>
        </div>

        <div class="result-area" id="resultArea">
          <div class="result-area__icon"><i class="fas fa-check-circle"></i></div>
          <p class="result-area__text" id="resultText">PDF split successfully!</p>
          <button class="result-area__download" id="downloadBtn">
            <i class="fas fa-download"></i> Download
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/main.js"></script>
  <script src="../js/pdf-tools.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      PDFTools.init({ accept: ".pdf", multiple: false, maxFiles: 1 });

      const origAdd = PDFTools.addFiles.bind(PDFTools);
      PDFTools.addFiles = function (fl) {
        this.files = [];
        origAdd(fl);
        document.getElementById("splitOptions").style.display = this.files.length ? "block" : "none";
      };

      function parsePageRange(input, totalPages) {
        if (!input.trim()) return Array.from({ length: totalPages }, (_, i) => i);
        const pages = new Set();
        input.split(",").forEach((part) => {
          const range = part.trim().split("-");
          if (range.length === 2) {
            const start = Math.max(1, parseInt(range[0]));
            const end = Math.min(totalPages, parseInt(range[1]));
            for (let i = start; i <= end; i++) pages.add(i - 1);
          } else {
            const p = parseInt(range[0]);
            if (p >= 1 && p <= totalPages) pages.add(p - 1);
          }
        });
        return Array.from(pages).sort((a, b) => a - b);
      }

      document.getElementById("actionBtn").addEventListener("click", async () => {
        if (!PDFTools.files.length) return;

        try {
          PDFTools.showProgress(10, "Reading PDF...");
          const { PDFDocument } = PDFLib;
          const bytes = await PDFTools.readFileAsArrayBuffer(PDFTools.files[0]);
          const srcPdf = await PDFDocument.load(bytes);
          const totalPages = srcPdf.getPageCount();
          const pageRange = document.getElementById("pageRange").value;
          const indices = parsePageRange(pageRange, totalPages);

          PDFTools.showProgress(30, "Extracting pages...");
          const newPdf = await PDFDocument.create();
          const copiedPages = await newPdf.copyPages(srcPdf, indices);
          copiedPages.forEach((page) => newPdf.addPage(page));

          PDFTools.showProgress(90, "Generating PDF...");
          const newBytes = await newPdf.save();
          const blob = new Blob([newBytes], { type: "application/pdf" });

          PDFTools.showProgress(100, "Done!");
          PDFTools.showResult(
            `Extracted ${indices.length} page(s) from ${totalPages} total (${PDFTools.formatSize(blob.size)})`,
            blob,
            "split.pdf"
          );
        } catch (err) {
          alert("Error splitting PDF: " + err.message);
          PDFTools.hideProgress();
        }
      });
    });
  </script>
</body>
</html>
